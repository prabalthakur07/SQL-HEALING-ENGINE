version: '3.8'

services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - APP_API_KEY=${APP_API_KEY}
      - DB_DRIVER=postgres
      - DATABASE_URL=postgres://sql_engine_readonly:changeme@postgres:5432/demo
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=demo
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/roles-init.sql:/docker-entrypoint-initdb.d/00-roles-init.sql
      - ./data/seed.sql:/docker-entrypoint-initdb.d/01-seed.sql
      - ./data/grants.sql:/docker-entrypoint-initdb.d/02-grants.sql

volumes:
  pgdata:
